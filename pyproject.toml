[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-to-mp3"
version = "1.0.0"
description = "Conversor desktop local de WebM e MP4 para MP3"
requires-python = ">=3.10,<3.14"
dependencies = ["PySide6==6.8.3"]

[project.optional-dependencies]
build = ["PyInstaller==6.14.2", "Pillow==11.3.0"]

[tool.setuptools]
py-modules = ["app", "converter", "runtime", "dialogs", "ui", "smoke_test"]
