name: Test and package desktop apps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
            architecture: x64
          - target: windows-x64
            runner: windows-2022
            architecture: x64
          - target: macos-x64
            runner: macos-15-intel
            architecture: x64
          - target: macos-arm64
            runner: macos-14
            architecture: arm64
    env:
      QT_QPA_PLATFORM: offscreen
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Linux build and test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl xz-utils ffmpeg libgl1 libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: macOS test fixtures
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Windows test fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Python dependencies from lock
        run: |
          python -m pip install uv==0.12.5
          uv sync --frozen --extra build
      - name: Unit and integration tests
        run: uv run --frozen --extra build python -m unittest -v
      - name: MSYS2 native toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make diffutils tar curl xz perl
            mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
      - name: Build media tools (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-media.sh
      - name: Build media tools (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/build-media.sh
      - name: Test the compiled media tools
        run: uv run --frozen --extra build python scripts/test_media.py
      - name: Build distributable
        run: uv run --frozen --extra build python scripts/package.py
      - name: Test extracted package without Python or FFmpeg on PATH
        run: uv run --frozen --extra build python scripts/check_package.py
      - name: Test offline on clean Ubuntu 22.04 with desktop libraries
        if: runner.os == 'Linux'
        run: bash scripts/check_linux_container.sh
      - name: Upload tested package, sources and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: video-to-mp3-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
